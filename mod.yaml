title: "Keys Not Included"
description: "Extra hotkeys and better UI defaults. Keys to deconstruct the selected building (again to cancel), cancel a selected construction, and deconstruct background buildings (Shift+X); all rebindable in Options > Controls, where Esc now clears a binding. Deconstruct starts on the Buildings layer, and opening the Oxygen, Power, Plumbing, Ventilation, Automation, Shipping or Radiation build menu switches to its overlay. Configure with the Options button in the Mods screen."
staticID: KeysNotIncluded
